<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>立方体チェッカー</title><style>body{margin:0;padding:12px;background:#f2f4f7;font-family:system-ui}canvas{display:block;width:100%;height:auto;background:white;border:2px solid #333;border-radius:12px;touch-action:none}button{font-size:17px;padding:12px;margin:8px 5px 0 0;border:0;border-radius:10px;background:#222;color:white}#status{background:white;padding:10px;border-radius:10px;margin:8px 0}#score{font-size:28px;font-weight:bold;margin-top:12px}</style></head><body><h2>立方体 正確さチェッカー</h2><div id="status">白い部分を指でなぞってください</div><canvas id="c" width="900" height="600"></canvas><button onclick="clearAll()">消去</button><button onclick="undo()">1本戻す</button><button onclick="judge()">採点</button><div id="score"></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),st=document.getElementById('status');let a=[],s=null,on=false;function pt(e){let r=c.getBoundingClientRect(),q=e.touches?e.touches[0]:e;return{x:(q.clientX-r.left)*c.width/r.width,y:(q.clientY-r.top)*c.height/r.height}}function draw(z){if(!z||!z.length)return;x.beginPath();x.moveTo(z[0].x,z[0].y);for(let i=1;i<z.length;i++)x.lineTo(z[i].x,z[i].y);x.stroke()}function redraw(){x.clearRect(0,0,c.width,c.height);x.lineWidth=7;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#111';a.forEach(draw);draw(s)}function down(e){e.preventDefault();on=true;s=[pt(e)];st.textContent='✏️ 描画中…'}function move(e){if(!on)return;e.preventDefault();s.push(pt(e));redraw()}function up(e){if(!on)return;e.preventDefault();on=false;if(s&&s.length>2)a.push(s);s=null;redraw();st.textContent='✅ 線を受け取りました'}c.addEventListener('pointerdown',down,{passive:false});c.addEventListener('pointermove',move,{passive:false});c.addEventListener('pointerup',up,{passive:false});c.addEventListener('pointercancel',up,{passive:false});c.addEventListener('touchstart',down,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',up,{passive:false});function clearAll(){a=[];s=null;on=false;document.getElementById('score').textContent='';st.textContent='白い部分を指でなぞってください';redraw()}function undo(){a.pop();redraw()}function judge(){if(!a.length){document.getElementById('score').textContent='線を描いてください';return}let l=a.map(z=>Math.hypot(z.at(-1).x-z[0].x,z.at(-1).y-z[0].y)),m=l.reduce((u,v)=>u+v,0)/l.length,v=l.reduce((u,q)=>u+Math.abs(q-m)/m,0)/l.length;document.getElementById('score').textContent='正確さ：'+Math.max(0,Math.min(100,Math.round(100-v*100)))+'%'}redraw()</script></body></html>
